
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness CRM - Member Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Status Badge Colors */
        .status-active { background-color: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .status-warning { background-color: #fffbeb; color: #92400e; border: 1px solid #f59e0b; }
        .status-expired { background-color: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }
        
        /* Glassmorphism Effect */
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Custom Checkbox */
        input[type="checkbox"]:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="bg-slate-50 pb-28">

    <!-- Header / Navbar Atas -->
    <header class="bg-white border-b sticky top-0 z-40 px-5 py-4 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">FIT<span class="text-blue-600">PRO</span> CRM</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Fitness Consultant Assistant</p>
            </div>
            <div id="stats-badge" class="bg-blue-600 text-white text-[10px] font-black px-3 py-1.5 rounded-full shadow-lg shadow-blue-200">
                0 MEMBER
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <!-- HALAMAN DAFTAR MEMBER -->
        <section id="tab-list" class="tab-content active">
            <div class="relative mb-6">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="Cari nama atau status..." 
                    class="w-full pl-10 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm" 
                    oninput="renderMembers()">
            </div>
            
            <div id="member-container" class="space-y-4">
                <!-- Data akan di-render di sini oleh JavaScript -->
            </div>
        </section>

        <!-- HALAMAN TAMBAH MEMBER -->
        <section id="tab-add" class="tab-content">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <span class="bg-blue-100 p-2 rounded-lg text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                    Member Baru
                </h2>
                <form id="member-form" class="space-y-5">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Nama Lengkap</label>
                        <input type="text" id="name" placeholder="Masukkan nama klien" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Tanggal Lahir</label>
                            <input type="date" id="dob" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none" required>
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Mulai Member</label>
                            <input type="date" id="start_date" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Tipe Membership</label>
                            <select id="duration" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none">
                                <option value="1">1 Bulan</option>
                                <option value="3">3 Bulan</option>
                                <option value="6">6 Bulan</option>
                                <option value="12">12 Bulan</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">No. WhatsApp</label>
                            <input type="tel" id="whatsapp" placeholder="08..." class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none" required>
                        </div>
                    </div>

                    <div class="py-2">
                        <label class="flex items-center gap-3 cursor-pointer p-4 bg-blue-50 rounded-2xl border border-blue-100 active:scale-[0.98] transition-all">
                            <input type="checkbox" id="use_pt" class="w-6 h-6 rounded-lg border-none ring-2 ring-blue-200 checked:bg-blue-600 appearance-none transition-all">
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-blue-900">Personal Trainer (PT)</span>
                                <span class="text-[10px] text-blue-600 font-medium">Aktifkan jika klien memakai jasa coach</span>
                            </div>
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-extrabold text-sm uppercase tracking-widest shadow-xl shadow-slate-200 active:scale-95 transition-all">
                        Simpan Member
                    </button>
                </form>
            </div>
        </section>

        <!-- HALAMAN DATA & EXPORT -->
        <section id="tab-data" class="tab-content">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 text-center">
                <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                </div>
                <h2 class="text-xl font-extrabold text-slate-800 mb-2">Manajemen Laporan</h2>
                <p class="text-sm text-slate-400 mb-8">Data tersimpan aman secara offline di perangkat Anda.</p>
                
                <button onclick="exportCSV()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-bold shadow-lg shadow-green-100 flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <span>Ekspor ke Excel (CSV)</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Navigasi Bawah (Mobile Friendly) -->
    <nav class="fixed bottom-0 left-0 right-0 glass-nav border-t border-slate-100 flex justify-around p-4 z-50 rounded-t-[32px] shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center text-blue-600 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
            <span class="text-[9px] font-black mt-1 uppercase tracking-tighter">Database</span>
        </button>
        <button onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center text-slate-300 transition-all">
            <div class="bg-slate-50 p-3 rounded-2xl -mt-8 shadow-lg border border-slate-100 text-slate-400 transition-all" id="add-icon-bg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            </div>
            <span class="text-[9px] font-black mt-1 uppercase tracking-tighter">Baru</span>
        </button>
        <button onclick="switchTab('data')" id="nav-data" class="flex flex-col items-center text-slate-300 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            <span class="text-[9px] font-black mt-1 uppercase tracking-tighter">Laporan</span>
        </button>
    </nav>

    <script>
        // LOGIKA APLIKASI
        let members = JSON.parse(localStorage.getItem('fit_pro_crm_data')) || [];

        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start_date').value = today;
            renderMembers();
        };

        function calculateAge(dob) {
            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        }

        function calculateExpiry(startDate, months) {
            const date = new Date(startDate);
            date.setMonth(date.getMonth() + parseInt(months));
            return date;
        }

        function getDaysRemaining(expiryDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expiry = new Date(expiryDate);
            expiry.setHours(0, 0, 0, 0);
            const diffTime = expiry - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function formatDisplayDate(dateObj) {
            return dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            
            // UI Navigation Update
            const tabs = ['list', 'add', 'data'];
            tabs.forEach(t => {
                const btn = document.getElementById('nav-' + t);
                if(t === tabId) {
                    btn.classList.add('text-blue-600');
                    btn.classList.remove('text-slate-300');
                    if(t === 'add') {
                        document.getElementById('add-icon-bg').classList.add('bg-blue-600', 'text-white');
                        document.getElementById('add-icon-bg').classList.remove('bg-slate-50', 'text-slate-400');
                    }
                } else {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-300');
                    if(t === 'add') {
                        document.getElementById('add-icon-bg').classList.remove('bg-blue-600', 'text-white');
                        document.getElementById('add-icon-bg').classList.add('bg-slate-50', 'text-slate-400');
                    }
                }
            });

            if(tabId === 'list') renderMembers();
        }

        document.getElementById('member-form').onsubmit = (e) => {
            e.preventDefault();
            const newMember = {
                id: Date.now(),
                name: document.getElementById('name').value,
                dob: document.getElementById('dob').value,
                startDate: document.getElementById('start_date').value,
                durationMonths: document.getElementById('duration').value,
                whatsapp: document.getElementById('whatsapp').value,
                usePT: document.getElementById('use_pt').checked,
                lastChat: null 
            };
            members.push(newMember);
            saveData();
            e.target.reset();
            document.getElementById('start_date').value = new Date().toISOString().split('T')[0];
            switchTab('list');
        };

        function contactWhatsApp(id) {
            const index = members.findIndex(m => m.id === id);
            if (index !== -1) {
                const now = new Date();
                const timeString = now.toLocaleDateString('id-ID', { 
                    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
                });
                
                members[index].lastChat = timeString;
                saveData();
                renderMembers();

                let rawPhone = members[index].whatsapp.replace(/[^0-9]/g, '');
                if (rawPhone.startsWith('0')) rawPhone = '62' + rawPhone.slice(1);
                window.open(`https://wa.me/${rawPhone}`, '_blank');
            }
        }

        function deleteMember(id) {
            if(confirm('Hapus member ini dari database?')) {
                members = members.filter(m => m.id !== id);
                saveData();
                renderMembers();
            }
        }

        function saveData() {
            localStorage.setItem('fit_pro_crm_data', JSON.stringify(members));
        }

        function renderMembers() {
            const container = document.getElementById('member-container');
            const search = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = '';
            
            document.getElementById('stats-badge').innerText = members.length + ' MEMBER';

            const filtered = members.filter(m => 
                m.name.toLowerCase().includes(search)
            );

            filtered.sort((a, b) => new Date(b.id) - new Date(a.id)).forEach(m => {
                const age = calculateAge(m.dob);
                const expiryDate = calculateExpiry(m.startDate, m.durationMonths);
                const daysLeft = getDaysRemaining(expiryDate);
                
                let statusClass = "status-active";
                let statusText = "Aktif";
                if (daysLeft < 0) { 
                    statusClass = "status-expired"; 
                    statusText = "Habis"; 
                } else if (daysLeft <= 7) { 
                    statusClass = "status-warning"; 
                    statusText = "Limit"; 
                }

                const card = document.createElement('div');
                card.className = "bg-white rounded-[24px] shadow-sm border border-slate-100 overflow-hidden";
                card.innerHTML = `
                    <div class="p-4 border-b border-slate-50 flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-0.5">
                                <h3 class="font-bold text-slate-800 text-sm tracking-tight">${m.name}</h3>
                                ${m.usePT ? '<span class="bg-purple-100 text-purple-700 text-[8px] px-1.5 py-0.5 rounded-full font-black uppercase tracking-tighter">COACH</span>' : ''}
                            </div>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">${age} TAHUN • LAHIR: ${m.dob}</p>
                        </div>
                        <span class="text-[9px] font-black px-2.5 py-1 rounded-full uppercase tracking-tighter ${statusClass}">
                            ${statusText}
                        </span>
                    </div>
                    <div class="p-4 bg-slate-50/30">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <p class="text-[9px] text-slate-300 uppercase font-extrabold mb-0.5">Membership</p>
                                <p class="text-xs font-bold text-slate-600">${m.durationMonths} Bulan</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] text-slate-300 uppercase font-extrabold mb-0.5">Exp Date</p>
                                <p class="text-xs font-black text-blue-600 uppercase italic">${formatDisplayDate(expiryDate)}</p>
                            </div>
                        </div>
                        <div class="flex items-end justify-between">
                            <div>
                                <p class="text-[9px] text-slate-300 uppercase font-extrabold mb-0.5">Sisa Waktu</p>
                                <p class="text-xl font-black ${daysLeft < 0 ? 'text-red-500' : 'text-slate-900'}">
                                    ${daysLeft < 0 ? '0' : daysLeft} <span class="text-[10px] font-bold text-slate-400">HARI</span>
                                </p>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <div class="flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 rounded-full ${m.lastChat ? 'bg-green-400' : 'bg-slate-200'}"></div>
                                    <span class="text-[9px] text-slate-400 font-medium italic">
                                        ${m.lastChat ? 'Chat: ' + m.lastChat : 'Belum dichat'}
                                    </span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="deleteMember(${m.id})" class="p-2.5 text-red-200 hover:text-red-400 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                    </button>
                                    <button onclick="contactWhatsApp(${m.id})" class="bg-green-500 text-white px-5 py-2.5 rounded-2xl text-[10px] font-black shadow-lg shadow-green-100 flex items-center gap-2 active:bg-green-600 transition-all uppercase tracking-widest">
                                        <span>HUBUNGI WA</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function exportCSV() {
            if (members.length === 0) return alert('Data masih kosong');
            let csv = "Nama,Tgl Lahir,Usia,Tgl Mulai,Durasi Bulan,Tgl Berakhir,WhatsApp,Pakai PT,Terakhir Chat\n";
            members.forEach(m => {
                const expiry = calculateExpiry(m.startDate, m.durationMonths);
                csv += `"${m.name}","${m.dob}",${calculateAge(m.dob)},"${m.startDate}",${m.durationMonths},"${expiry.toISOString().split('T')[0]}","${m.whatsapp}","${m.usePT ? 'Ya' : 'Tidak'}","${m.lastChat || '-'}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `fit-pro-report-${new Date().getTime()}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
