
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAN.WILLFITNESS - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Status Badge Colors */
        .status-active { background-color: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .status-warning { background-color: #fffbeb; color: #92400e; border: 1px solid #f59e0b; }
        .status-expired { background-color: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }
        
        /* Birthday Style */
        .card-birthday { 
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid #f59e0b;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.2);
        }

        /* Glassmorphism Effect */
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }

        /* Fullscreen button pulse */
        .btn-fullscreen.active {
            color: #2563eb;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-slate-50 pb-28">

    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-40 px-5 py-5 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tighter">JAN.<span class="text-blue-600">WILLFITNESS</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Member Management System</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleFullscreen()" id="btn-fs" class="p-2 text-slate-400 hover:text-blue-600 transition-colors" title="Fullscreen & Stay Awake">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                    </svg>
                </button>
                <div id="stats-badge" class="bg-slate-900 text-white text-[10px] font-black px-3 py-1.5 rounded-full">
                    0 MEMBER
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <!-- DAFTAR MEMBER -->
        <section id="tab-list" class="tab-content active">
            <div class="relative mb-6">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="Cari nama member..." 
                    class="w-full pl-10 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition-all text-sm" 
                    oninput="renderMembers()">
            </div>
            
            <div id="birthday-announcement" class="hidden mb-4 p-4 bg-amber-100 text-amber-800 rounded-2xl text-xs font-bold flex items-center gap-3 border border-amber-200">
                <span class="text-xl">🎂</span> Ada member yang berulang tahun hari ini! Segera berikan ucapan.
            </div>

            <div id="member-container" class="space-y-4">
                <!-- Diisi oleh JS -->
            </div>
        </section>

        <!-- TAMBAH MEMBER -->
        <section id="tab-add" class="tab-content">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    Member Baru
                </h2>
                <form id="member-form" class="space-y-5">
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Nama Lengkap</label>
                        <input type="text" id="name" placeholder="Nama Klien" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-600 outline-none" required>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Tanggal Lahir</label>
                            <input type="date" id="dob" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none" required>
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Mulai Member</label>
                            <input type="date" id="start_date" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Tipe Membership</label>
                            <select id="duration" class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none">
                                <option value="1">1 Bulan</option>
                                <option value="3">3 Bulan</option>
                                <option value="6">6 Bulan</option>
                                <option value="12">12 Bulan</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">No. WhatsApp</label>
                            <input type="tel" id="whatsapp" placeholder="08..." class="w-full p-4 bg-slate-50 rounded-2xl border-none ring-1 ring-slate-200 outline-none" required>
                        </div>
                    </div>

                    <div class="py-2">
                        <label class="flex items-center gap-3 cursor-pointer p-4 bg-blue-50 rounded-2xl border border-blue-100 active:scale-[0.98] transition-all">
                            <input type="checkbox" id="use_pt" class="w-6 h-6 rounded-lg border-none ring-2 ring-blue-200 checked:bg-blue-600 appearance-none transition-all">
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-blue-900 uppercase tracking-tight">Layanan Personal Trainer</span>
                                <span class="text-[10px] text-blue-600 font-medium">Aktifkan jika klien didampingi coach</span>
                            </div>
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-extrabold text-sm uppercase tracking-widest shadow-xl active:scale-95 transition-all">
                        Simpan Member
                    </button>
                </form>
            </div>
        </section>

        <!-- LAPORAN & STATISTIK -->
        <section id="tab-data" class="tab-content">
            <div class="space-y-4">
                <h2 class="text-lg font-extrabold text-slate-800 px-1">Ringkasan Statistik</h2>
                
                <div class="grid grid-cols-1 gap-4">
                    <div class="stat-card flex items-center justify-between border-l-4 border-l-blue-500">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase italic">Pendaftaran Hari Ini</p>
                            <h3 id="stat-daily" class="text-2xl font-black text-slate-900">0</h3>
                        </div>
                        <div class="bg-blue-50 p-4 rounded-2xl text-blue-500 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="stat-card border-l-4 border-l-green-500">
                            <p class="text-[10px] font-bold text-slate-400 uppercase italic">Minggu Ini</p>
                            <h3 id="stat-weekly" class="text-2xl font-black text-slate-900">0</h3>
                        </div>
                        <div class="stat-card border-l-4 border-l-purple-500">
                            <p class="text-[10px] font-bold text-slate-400 uppercase italic">Bulan Ini</p>
                            <h3 id="stat-monthly" class="text-2xl font-black text-slate-900">0</h3>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mt-6">
                    <h3 class="text-sm font-bold text-slate-800 mb-4">Export Data</h3>
                    <button onclick="exportCSV()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg shadow-green-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <span>Ekspor ke Excel (CSV)</span>
                    </button>
                    <p class="text-[10px] text-center text-slate-400 mt-4 font-medium uppercase tracking-widest">Offline Database Active</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass-nav border-t border-slate-100 flex justify-around p-4 z-50 rounded-t-[32px] shadow-lg">
        <button onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center text-blue-600 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
            <span class="text-[9px] font-black mt-1 uppercase">Database</span>
        </button>
        <button onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center text-slate-300 transition-all">
            <div class="bg-slate-100 p-3 rounded-2xl -mt-8 shadow-lg text-slate-400 transition-all" id="add-icon-bg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            </div>
            <span class="text-[9px] font-black mt-1 uppercase">Baru</span>
        </button>
        <button onclick="switchTab('data')" id="nav-data" class="flex flex-col items-center text-slate-300 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
            <span class="text-[9px] font-black mt-1 uppercase">Laporan</span>
        </button>
    </nav>

    <script>
        let members = JSON.parse(localStorage.getItem('jan_willfitness_v1')) || [];
        let wakeLock = null;

        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start_date').value = today;
            renderMembers();
            renderStats();
        };

        // FULLSCREEN & WAKE LOCK LOGIC
        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                    document.getElementById('btn-fs').classList.add('active');
                    requestWakeLock();
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                        document.getElementById('btn-fs').classList.remove('active');
                        releaseWakeLock();
                    }
                }
            } catch (err) {
                console.error(`Error toggling fullscreen: ${err.message}`);
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // Handle visibility change to re-request wake lock if needed
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        function isBirthdayToday(dobString) {
            const today = new Date();
            const dob = new Date(dobString);
            return today.getDate() === dob.getDate() && today.getMonth() === dob.getMonth();
        }

        function calculateAge(dob) {
            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        }

        function calculateExpiry(startDate, months) {
            const date = new Date(startDate);
            date.setMonth(date.getMonth() + parseInt(months));
            return date;
        }

        function getDaysRemaining(expiryDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expiry = new Date(expiryDate);
            expiry.setHours(0, 0, 0, 0);
            const diffTime = expiry - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function formatDisplayDate(dateObj) {
            return dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            
            const tabs = ['list', 'add', 'data'];
            tabs.forEach(t => {
                const btn = document.getElementById('nav-' + t);
                if(t === tabId) {
                    btn.classList.add('text-blue-600');
                    btn.classList.remove('text-slate-300');
                    if(t === 'add') {
                        document.getElementById('add-icon-bg').classList.add('bg-blue-600', 'text-white');
                        document.getElementById('add-icon-bg').classList.remove('bg-slate-100', 'text-slate-400');
                    }
                } else {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-300');
                    if(t === 'add') {
                        document.getElementById('add-icon-bg').classList.remove('bg-blue-600', 'text-white');
                        document.getElementById('add-icon-bg').classList.add('bg-slate-100', 'text-slate-400');
                    }
                }
            });

            if(tabId === 'list') renderMembers();
            if(tabId === 'data') renderStats();
        }

        document.getElementById('member-form').onsubmit = (e) => {
            e.preventDefault();
            const newMember = {
                id: Date.now(),
                name: document.getElementById('name').value,
                dob: document.getElementById('dob').value,
                startDate: document.getElementById('start_date').value,
                durationMonths: document.getElementById('duration').value,
                whatsapp: document.getElementById('whatsapp').value,
                usePT: document.getElementById('use_pt').checked,
                lastChat: null 
            };
            members.push(newMember);
            saveData();
            e.target.reset();
            document.getElementById('start_date').value = new Date().toISOString().split('T')[0];
            switchTab('list');
        };

        function contactWhatsApp(id) {
            const index = members.findIndex(m => m.id === id);
            if (index !== -1) {
                const now = new Date();
                const timeString = now.toLocaleDateString('id-ID', { 
                    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
                });
                members[index].lastChat = timeString;
                saveData();
                renderMembers();
                let rawPhone = members[index].whatsapp.replace(/[^0-9]/g, '');
                if (rawPhone.startsWith('0')) rawPhone = '62' + rawPhone.slice(1);
                window.open(`https://wa.me/${rawPhone}`, '_blank');
            }
        }

        function deleteMember(id) {
            if(confirm('Hapus member ini dari database?')) {
                members = members.filter(m => m.id !== id);
                saveData();
                renderMembers();
            }
        }

        function saveData() {
            localStorage.setItem('jan_willfitness_v1', JSON.stringify(members));
        }

        function renderMembers() {
            const container = document.getElementById('member-container');
            const search = document.getElementById('search-input').value.toLowerCase();
            const birthdayAnnounce = document.getElementById('birthday-announcement');
            container.innerHTML = '';
            
            document.getElementById('stats-badge').innerText = members.length + ' MEMBER';

            let hasBirthday = false;

            const sortedMembers = [...members].sort((a, b) => {
                const aBDay = isBirthdayToday(a.dob);
                const bBDay = isBirthdayToday(b.dob);
                if (aBDay && !bBDay) return -1;
                if (!aBDay && bBDay) return 1;
                return b.id - a.id;
            });

            const filtered = sortedMembers.filter(m => m.name.toLowerCase().includes(search));

            filtered.forEach(m => {
                const age = calculateAge(m.dob);
                const isBDay = isBirthdayToday(m.dob);
                if(isBDay) hasBirthday = true;

                const expiryDate = calculateExpiry(m.startDate, m.durationMonths);
                const daysLeft = getDaysRemaining(expiryDate);
                
                let statusClass = "status-active";
                let statusText = "Aktif";
                if (daysLeft < 0) { statusClass = "status-expired"; statusText = "Habis"; }
                else if (daysLeft <= 7) { statusClass = "status-warning"; statusText = "Limit"; }

                const card = document.createElement('div');
                card.className = `rounded-[32px] shadow-sm border border-slate-100 overflow-hidden transition-all ${isBDay ? 'card-birthday' : 'bg-white'}`;
                card.innerHTML = `
                    <div class="p-6 border-b border-black/5 flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-bold text-slate-800 text-base tracking-tight">${m.name}</h3>
                                ${isBDay ? '<span>🎂</span>' : ''}
                                ${m.usePT ? '<span class="bg-blue-600 text-white text-[7px] px-2 py-0.5 rounded-full font-black uppercase shadow-sm">PT</span>' : ''}
                            </div>
                            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">
                                ${isBDay ? '<span class="text-amber-600">ULANG TAHUN HARI INI!</span>' : `${age} TAHUN • LAHIR: ${m.dob}`}
                            </p>
                        </div>
                        <span class="text-[9px] font-black px-3 py-1.5 rounded-full uppercase tracking-tighter ${statusClass}">
                            ${statusText}
                        </span>
                    </div>
                    <div class="p-6 ${isBDay ? 'bg-amber-50/20' : 'bg-slate-50/30'}">
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <p class="text-[9px] text-slate-400 uppercase font-extrabold mb-1">Paket</p>
                                <p class="text-sm font-bold text-slate-700">${m.durationMonths} Bulan</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] text-slate-400 uppercase font-extrabold mb-1">Berakhir</p>
                                <p class="text-sm font-black text-slate-900 uppercase italic">${formatDisplayDate(expiryDate)}</p>
                            </div>
                        </div>
                        <div class="flex items-end justify-between">
                            <div>
                                <p class="text-[9px] text-slate-400 uppercase font-extrabold mb-1">Sisa Hari</p>
                                <p class="text-2xl font-black ${daysLeft < 0 ? 'text-red-500' : 'text-slate-900'}">
                                    ${daysLeft < 0 ? '0' : daysLeft} <span class="text-xs font-bold text-slate-400 italic">HARI</span>
                                </p>
                            </div>
                            <div class="flex flex-col items-end gap-3">
                                <span class="text-[10px] font-medium italic text-slate-400">
                                    ${m.lastChat ? '💬 ' + m.lastChat : '⚪ Belum dichat'}
                                </span>
                                <div class="flex gap-2">
                                    <button onclick="deleteMember(${m.id})" class="p-3 bg-white border border-slate-100 text-red-400 rounded-2xl shadow-sm">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                    </button>
                                    <button onclick="contactWhatsApp(${m.id})" class="bg-green-500 text-white px-6 py-3 rounded-2xl text-[10px] font-black shadow-lg shadow-green-100 flex items-center gap-2 active:scale-95 transition-all uppercase tracking-widest">
                                        <span>HUBUNGI WA</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            birthdayAnnounce.classList.toggle('hidden', !hasBirthday);
        }

        function renderStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const oneDay = 24 * 60 * 60 * 1000;
            const weekAgo = new Date(today.getTime() - (7 * oneDay));
            const monthAgo = new Date(today.getTime() - (30 * oneDay));

            let daily = 0, weekly = 0, monthly = 0;

            members.forEach(m => {
                const joinDate = new Date(m.startDate);
                joinDate.setHours(0, 0, 0, 0);

                if (joinDate.getTime() === today.getTime()) daily++;
                if (joinDate.getTime() >= weekAgo.getTime()) weekly++;
                if (joinDate.getTime() >= monthAgo.getTime()) monthly++;
            });

            document.getElementById('stat-daily').innerText = daily;
            document.getElementById('stat-weekly').innerText = weekly;
            document.getElementById('stat-monthly').innerText = monthly;
        }

        function exportCSV() {
            if (members.length === 0) return alert('Data masih kosong');
            let csv = "Nama,Tgl Lahir,Usia,Tgl Mulai,Durasi Bulan,Tgl Berakhir,WhatsApp,Pakai PT,Terakhir Chat\n";
            members.forEach(m => {
                const expiry = calculateExpiry(m.startDate, m.durationMonths);
                csv += `"${m.name}","${m.dob}",${calculateAge(m.dob)},"${m.startDate}",${m.durationMonths},"${expiry.toISOString().split('T')[0]}","${m.whatsapp}","${m.usePT ? 'Ya' : 'Tidak'}","${m.lastChat || '-'}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `JANWILLFITNESS_REPORT_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
