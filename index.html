<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WILLFITNESS MEMBER LIST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; 
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Warna Status Membership - Dioptimalkan untuk List Profesional */
        .status-active { background-color: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-warning { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .status-expired { background-color: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        /* Kartu Hari Lahir Profesional */
        .row-birthday { 
            background: linear-gradient(90deg, rgba(15,23,42,1) 0%, rgba(49,16,66,0.3) 100%);
            border: 1px solid rgba(217, 70, 239, 0.4);
            box-shadow: -4px 0 0px #d946ef, 0 4px 20px -2px rgba(217, 70, 239, 0.1);
        }

        .row-standard {
            background-color: #0f172a;
            border: 1px solid rgba(30, 41, 59, 0.8);
        }

        /* Navigasi Glassmorphism */
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .stat-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
            border: 1px solid #1e293b;
        }

        /* Kustom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-[#020617] text-slate-100 h-screen w-full flex">

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col w-[280px] bg-[#090d22] border-r border-slate-800/80 z-50 h-full shrink-0">
        <div class="p-8 border-b border-slate-800/80">
            <h1 class="text-2xl font-extrabold text-white tracking-tighter uppercase leading-none">
                WILL<span class="text-sky-400">FITNESS</span>
            </h1>
            <p class="text-[10px] font-bold text-sky-400/80 uppercase tracking-widest mt-2">MEMBER LIST SYSTEM</p>
        </div>
        <div class="flex-1 py-8 px-6 space-y-3">
            <button onclick="switchTab('list')" id="desk-nav-list" class="w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-sm font-bold transition-all text-sky-400 bg-sky-500/10 border border-sky-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
                Database Member
            </button>
            <button onclick="switchTab('add')" id="desk-nav-add" class="w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white hover:bg-slate-800/50 border border-transparent">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                Tambah / Edit
            </button>
            <button onclick="switchTab('data')" id="desk-nav-data" class="w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-sm font-bold transition-all text-slate-400 hover:text-white hover:bg-slate-800/50 border border-transparent">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                Laporan & Keuangan
            </button>
        </div>
        <div class="p-6 border-t border-slate-800/80">
            <!-- Auth Section -->
            <div id="auth-section-desk" class="flex flex-col gap-2 mb-3">
                <button onclick="loginGoogle()" id="btn-login-desk" class="w-full py-2.5 bg-white text-slate-900 hover:bg-slate-200 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 transition-all">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Login untuk Sync
                </button>
                <div id="user-info-desk" class="hidden text-center bg-slate-900 border border-slate-800 rounded-xl p-2.5">
                    <p id="user-email-desk" class="text-[10px] text-sky-400 font-bold truncate px-2"></p>
                    <button onclick="logoutGoogle()" class="text-[9px] text-rose-400 mt-1 hover:underline uppercase tracking-widest font-bold">Logout</button>
                </div>
            </div>

            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest text-center flex items-center justify-center gap-2">
                <span class="relative flex h-2 w-2"><span id="cloud-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 hidden"></span><span id="cloud-dot" class="relative inline-flex rounded-full h-2 w-2 bg-slate-500"></span></span>
                <span id="cloud-text">Offline (Lokal)</span>
            </p>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden bg-[#020617]">
        
        <!-- Header Atas -->
        <header class="bg-[#090d22]/90 border-b border-slate-800/80 px-6 py-5 shadow-lg backdrop-blur-md shrink-0">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="md:hidden flex items-center gap-2">
                    <span class="relative flex h-2 w-2"><span id="cloud-ping-mobile" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 hidden"></span><span id="cloud-dot-mobile" class="relative inline-flex rounded-full h-2 w-2 bg-slate-500"></span></span>
                    <h1 class="text-xl font-extrabold text-white tracking-tighter uppercase">
                        WILL<span class="text-sky-400">FITNESS</span>
                    </h1>
                </div>
                <div class="hidden md:block">
                    <h2 class="text-lg font-bold text-slate-200" id="desktop-page-title">Database Member</h2>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="loginGoogle()" id="btn-login-mob" class="md:hidden px-3 py-2 bg-white text-slate-900 text-[10px] font-extrabold rounded-lg shadow uppercase">
                        Login Sync
                    </button>
                    <button onclick="logoutGoogle()" id="btn-logout-mob" class="hidden md:hidden px-3 py-2 bg-slate-900 border border-slate-800 text-rose-400 text-[10px] font-extrabold rounded-lg shadow uppercase">
                        Logout
                    </button>

                    <button onclick="toggleFullscreen()" id="btn-fs" class="p-2 text-slate-400 hover:text-sky-400 bg-slate-900 rounded-lg border border-slate-800 transition-all duration-200" title="Layar Penuh">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                        </svg>
                    </button>
                    <div class="bg-sky-500/10 border border-sky-500/20 text-sky-400 text-[10px] font-black px-4 py-2 rounded-full tracking-wider flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
                        <span id="stats-badge">0</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Scrollable Main Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 pb-28 md:pb-8">
            <div class="max-w-6xl mx-auto">
                
                <!-- TAB DAFTAR MEMBER -->
                <section id="tab-list" class="tab-content active">
                    <!-- Kontrol Pencarian, Pengurutan & Filter -->
                    <div class="flex flex-col md:flex-row gap-3 mb-4">
                        <!-- Kolom Pencarian -->
                        <div class="relative flex-1">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                            </span>
                            <input type="text" id="search-input" placeholder="Cari nama member..." 
                                class="w-full pl-11 pr-4 py-3.5 bg-[#0f172a] border border-slate-800 rounded-xl focus:ring-1 focus:ring-sky-500 outline-none transition-all text-sm text-white placeholder-slate-500" 
                                oninput="renderMembers()">
                        </div>

                        <!-- Kontrol Sortir & Tombol Filter -->
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <div class="flex w-full md:w-auto gap-2">
                                <select id="sort-select" onchange="applySortChange()" class="flex-1 md:w-56 p-3.5 bg-[#0f172a] text-slate-200 rounded-xl border border-slate-800 focus:ring-1 focus:ring-sky-500 outline-none text-xs font-semibold cursor-pointer appearance-none">
                                    <option value="transaction-date">Urut: Tgl Transaksi</option>
                                    <option value="start-date">Urut: Tgl Mulai Member</option>
                                    <option value="birthday-date">Urut: Ulang Tahun Terdekat</option>
                                    <option value="chat-date">Urut: Terakhir Di-Chat</option>
                                    <option value="membership-expiry">Urut: Sisa Hari Terkecil</option>
                                </select>
                                <button onclick="toggleSortOrder()" id="btn-sort-order" class="p-3.5 bg-[#0f172a] text-sky-400 rounded-xl border border-slate-800 hover:bg-slate-800 transition-all cursor-pointer flex-shrink-0" title="Ubah Arah Urutan">
                                    <svg id="sort-arrow" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-300 transform rotate-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                </button>
                                <button onclick="toggleFilterPanel()" class="p-3.5 bg-[#0f172a] text-slate-400 hover:text-sky-400 rounded-xl border border-slate-800 hover:bg-slate-800 transition-all cursor-pointer flex-shrink-0 flex items-center gap-2" title="Filter Spesifik">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
                                    <span class="hidden md:block text-xs font-bold">Filter</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Panel Filter Lanjutan -->
                    <div id="filter-panel" class="hidden mb-6 p-5 bg-[#0f172a] border border-slate-800 rounded-2xl shadow-lg relative">
                        <h3 class="text-[10px] font-bold text-sky-400 uppercase tracking-widest mb-4">Filter Spesifik</h3>
                        <button onclick="toggleFilterPanel()" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                        </button>
                        
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-5">
                            <div>
                                <label class="text-[10px] text-slate-500 block mb-1.5 uppercase font-semibold tracking-wider">Status</label>
                                <select id="filter-status" class="w-full p-2.5 bg-[#020617] text-white text-xs rounded-xl border border-slate-700 outline-none focus:border-sky-500">
                                    <option value="all">Semua Status</option>
                                    <option value="active">Aktif</option>
                                    <option value="warning">Hampir Habis (Limit)</option>
                                    <option value="expired">Habis (Expired)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 block mb-1.5 uppercase font-semibold tracking-wider">Layanan PT</label>
                                <select id="filter-pt" class="w-full p-2.5 bg-[#020617] text-white text-xs rounded-xl border border-slate-700 outline-none focus:border-sky-500">
                                    <option value="all">Semua</option>
                                    <option value="yes">Pakai PT</option>
                                    <option value="no">Tidak Pakai PT</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 block mb-1.5 uppercase font-semibold tracking-wider">Sign TNC</label>
                                <select id="filter-tnc" class="w-full p-2.5 bg-[#020617] text-white text-xs rounded-xl border border-slate-700 outline-none focus:border-sky-500">
                                    <option value="all">Semua</option>
                                    <option value="yes">Done TNC</option>
                                    <option value="no">Belum TNC</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 block mb-1.5 uppercase font-semibold tracking-wider">Paket (Bulan)</label>
                                <select id="filter-duration" class="w-full p-2.5 bg-[#020617] text-white text-xs rounded-xl border border-slate-700 outline-none focus:border-sky-500">
                                    <option value="all">Semua Paket</option>
                                    <option value="1">1 Bulan</option>
                                    <option value="3">3 Bulan</option>
                                    <option value="6">6 Bulan</option>
                                    <option value="12">12 Bulan</option>
                                    <option value="custom">Kustom</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-500 block mb-1.5 uppercase font-semibold tracking-wider">Sumber Leads</label>
                                <select id="filter-source" class="w-full p-2.5 bg-[#020617] text-white text-xs rounded-xl border border-slate-700 outline-none focus:border-sky-500">
                                    <option value="all">Semua Leads</option>
                                    <option value="Leads Internal">Leads Internal</option>
                                    <option value="TikTok">TikTok</option>
                                    <option value="IG">IG</option>
                                    <option value="FB">FB</option>
                                    <option value="Threads">Threads</option>
                                    <option value="BR">BR</option>
                                    <option value="WI">WI</option>
                                    <option value="WhatsApp">WhatsApp</option>
                                    <option value="Leads Pribadi">Leads Pribadi</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 border-t border-slate-800/80 pt-4">
                            <button onclick="resetFilters()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-lg hover:bg-slate-700 transition-all uppercase tracking-widest">Reset</button>
                            <button onclick="applyFilters()" class="px-6 py-2 bg-sky-500 text-slate-950 text-xs font-bold rounded-lg hover:bg-sky-400 transition-all shadow-lg shadow-sky-500/20 uppercase tracking-widest">Terapkan Filter</button>
                        </div>
                    </div>
                    
                    <!-- Pengumuman Ulang Tahun -->
                    <div id="birthday-announcement" class="hidden mb-6 p-4 bg-fuchsia-500/10 text-fuchsia-300 rounded-xl text-sm font-semibold flex items-center gap-3 border border-fuchsia-500/20">
                        <span class="text-xl">🎂</span> Ada member yang berulang tahun hari ini!
                    </div>

                    <!-- Indikator Filter Aktif -->
                    <div id="active-filter-indicator" class="hidden mb-4 text-xs font-bold text-sky-400 flex items-center gap-2">
                        <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span></span>
                        Filter Spesifik Sedang Aktif
                    </div>

                    <!-- Tempat Render List View Profesional -->
                    <div id="member-container" class="flex flex-col gap-3">
                        <!-- Diisi oleh JS -->
                    </div>
                </section>

                <!-- TAB TAMBAH / EDIT MEMBER -->
                <section id="tab-add" class="tab-content">
                    <div class="bg-[#0f172a] p-6 md:p-8 rounded-2xl border border-slate-800/80 max-w-3xl mx-auto">
                        <h2 id="form-title" class="text-xl font-bold text-white mb-8 tracking-tight border-b border-slate-800 pb-4">
                            Tambah Member Baru
                        </h2>
                        <form id="member-form" class="space-y-6">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-sm">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Nama Lengkap</label>
                                    <input type="text" id="name" class="w-full p-3 bg-[#020617] text-white rounded-xl border border-slate-800 focus:border-sky-500 outline-none" required>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">No. WhatsApp</label>
                                    <input type="tel" id="whatsapp" class="w-full p-3 bg-[#020617] text-white rounded-xl border border-slate-800 focus:border-sky-500 outline-none" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 text-sm">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Tanggal Lahir</label>
                                    <input type="date" id="dob" class="w-full p-3 bg-[#020617] text-slate-300 rounded-xl border border-slate-800 focus:border-sky-500 outline-none" required>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Tgl Transaksi</label>
                                    <input type="date" id="transaction_date" class="w-full p-3 bg-[#020617] text-slate-300 rounded-xl border border-slate-800 focus:border-sky-500 outline-none" required>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Tgl Start Member</label>
                                    <input type="date" id="start_date" class="w-full p-3 bg-[#020617] text-slate-300 rounded-xl border border-slate-800 focus:border-sky-500 outline-none" required>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-sm">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Membership (Bulan)</label>
                                    <div class="flex gap-2">
                                        <select id="duration" class="flex-1 p-3 bg-[#020617] text-white rounded-xl border border-slate-800 focus:border-sky-500 outline-none" onchange="toggleCustomDuration()">
                                            <option value="1">1 Bulan</option>
                                            <option value="3">3 Bulan</option>
                                            <option value="6">6 Bulan</option>
                                            <option value="12">12 Bulan</option>
                                            <option value="custom">Kustom...</option>
                                        </select>
                                        <input type="number" id="custom_duration" min="1" placeholder="Bln" class="hidden w-20 p-3 bg-[#020617] text-white rounded-xl border border-slate-800 focus:border-sky-500 outline-none">
                                    </div>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Sumber Leads</label>
                                    <select id="source" class="w-full p-3 bg-[#020617] text-white rounded-xl border border-slate-800 focus:border-sky-500 outline-none" required>
                                        <option value="Leads Internal">Leads Internal</option>
                                        <option value
